version: "3.9"

services:
  redis: # 👈 This name is your hostname
    image: redis:7-alpine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3001:80" # 👈 FIXED: Maps local port 3001 to container port 80
    restart: unless-stopped
    env_file:
      - ./frontend/.env #
    depends_on:
      - backend